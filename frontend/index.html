    <!-- Microsoft Clarity — ANONYMOUS VISITORS ONLY (decided 2026-09-18).

         Clarity records full session replays. Most signed-in users here are
         students and a large share are minors, so replays of them reading
         their own profile, the feed or the HoD desk must not leave the site.
         Anonymous funnel data is what actually informs the public pages, and
         that is what this keeps.

         supabase-js persists its session at localStorage["sb-<ref>-auth-token"]
         with the default storage adapter, and that is readable here, before
         React boots — so the tag is simply never inserted for a signed-in
         visitor. Matched by pattern rather than by hardcoded project ref so it
         survives a project change.

         If localStorage is unreachable (private mode, blocked site data) this
         skips Clarity as well. A session cannot persist there either, so the
         only cost is a little anonymous data, and the failure mode stays
         privacy-first rather than recording someone we could not identify.

         Signing in WITHIN a session never reloads the page, so the tag would
         already be running. AuthContext calls clarity('stop') on sign-in to
         cover that. -->
    <script type="text/javascript">
      (function () {
        var signedIn;
        try {
          signedIn = false;
          for (var n = 0; n < localStorage.length; n++) {
            var k = localStorage.key(n);
            if (k && /^sb-.+-auth-token$/.test(k)) { signedIn = true; break; }
          }
        } catch (e) {
          signedIn = true;
        }
        if (signedIn) return;
        (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "v8xi8sv15p");
      })();
    </script>

    <!-- NO DEFAULT CANONICAL, deliberately (audit 2026-09-17).
         There used to be a hardcoded canonical here pointing at the bare origin,
         which existed mainly as a substitution anchor for prerender-meta.mjs. The
         cost was that EVERY route the prerenderer does not cover shipped it
         verbatim - /post/:uuid, /member/:uuid, /opportunities/:id,

         does not run JS that those pages ARE the homepage.

         end of the head by prerender-meta.mjs (injectHead), useMeta sets one at
         runtime for JS consumers, and anything else self-canonicalises, which is
         the correct default.
         Do not write the head closing tag literally in this comment: injectHead
         searches for it, and an occurrence in prose once swallowed the tag. -->

    <!-- Dynamic favicon switcher for aq/paradox sections -->
    <script>
      (function() {
        const updateFavicon = () => {
          const path = window.location.pathname;
          const faviconLink = document.querySelector('link[rel="icon"]');
          const manifestLink = document.querySelector('link[rel="manifest"]');
          const themeColor = document.querySelector('meta[name="theme-color"]');

          if (path.startsWith('/paradox')) {
            if (faviconLink) faviconLink.href = '/paradox/favicon.svg';
            if (manifestLink) manifestLink.href = '/paradox/site.webmanifest';
            if (themeColor) themeColor.content = '#FF4338';
          } else {
            if (faviconLink) faviconLink.href = '/favicon.png';
            if (manifestLink) manifestLink.href = '/site.webmanifest';
            if (themeColor) themeColor.content = '#F4EFE0';
          }
        };

        // Update on initial load
        updateFavicon();

        // Update on route changes (for SPA navigation)
        window.addEventListener('popstate', updateFavicon);

        // Listen for history changes
        const originalPushState = window.history.pushState;
        window.history.pushState = function(...args) {
          originalPushState.apply(window.history, args);
          updateFavicon();
        };
      })();
    </script>

    <style>
      /* Prevent flash of unstyled content */
      html { background: #F4EFE0; }

      /* Screen-reader only utility */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
      }

      /* ── First-paint skeleton ──────────────────────────────────────────────
         Sits over scripts/prerender-meta.mjs's real crawlable <body> (the
         semantic h1/p/nav SEO content that lives inside #root until React
         mounts) so a person gets a branded loading moment instead of a bare
         bullet list on a slow connection, while a non-JS crawler underneath
         still reads the real text untouched. `position: fixed` anchors it to
         the viewport directly rather than depending on #root becoming a
         positioning context — #root stays untouched (no `position` rule
         added to it), so this cannot change the containing block of any
         `position: absolute` element the real app renders later. `createRoot
         (root).render()` in main.tsx replaces every child of #root on mount
         (prerender-meta.mjs's own file header: "not a hydration source"), so
         this disappears the instant React takes over — nothing here needs to
         remove it manually. Kept in this render-blocking inline <style> tag
         (not the external bundle) so it paints before any network request
         beyond this document, and duplicated per generated page rather than
         shared, because index.html is the template prerender-meta.mjs clones. */
      .pr-skel {
        position: fixed; inset: 0; z-index: 2147483647;
        display: flex; flex-direction: column;
        background: #F4EFE0;
        overflow: hidden;
      }
      .pr-skel-nav {
        display: flex; align-items: center; gap: 18px;
        height: 70px; padding: 0 24px;
        border-bottom: 1px solid rgba(10,10,10,0.08);
        flex-shrink: 0;
      }
      .pr-skel-dot { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; }
      .pr-skel-pill { height: 15px; border-radius: 999px; }
      .pr-skel-pill:last-child { margin-left: auto; width: 84px !important; height: 34px; border-radius: 999px; }
      .pr-skel-main {
        max-width: 720px; margin: 0 auto; width: 100%;
        padding: min(22vh, 180px) 24px 0;
        display: flex; flex-direction: column; align-items: flex-start; gap: 14px;
        box-sizing: border-box;
      }
      .pr-skel-brand {
        display: flex; align-items: center; gap: 9px;
        margin-bottom: 6px;
      }
      .pr-skel-live {
        width: 9px; height: 9px; border-radius: 50%;
        background: #1B8A5A;
        animation: pr-blink 1.8s ease-in-out infinite;
        flex-shrink: 0;
      }
      .pr-skel-word {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-weight: 800; font-size: 13px; letter-spacing: 0.14em;
        color: #0A0A0A; opacity: 0.55;
      }
      .pr-skel-bar { display: block; height: 22px; border-radius: 7px; }
      .pr-skel-bar-xl { height: 42px; border-radius: 10px; }
      .pr-skel-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
      .pr-skel-chip { display: block; width: 92px; height: 36px; border-radius: 999px; }

      .pr-skel-dot, .pr-skel-pill, .pr-skel-bar, .pr-skel-chip {
        background: linear-gradient(100deg,
          rgba(10,10,10,0.07) 30%, rgba(10,10,10,0.14) 50%, rgba(10,10,10,0.07) 70%);
        background-size: 200% 100%;
        animation: pr-shimmer 1.5s ease-in-out infinite;
      }
      @keyframes pr-shimmer { 0% { background-position: 150% 0; } 100% { background-position: -50% 0; } }
      @keyframes pr-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @media (max-width: 600px) {
        .pr-skel-main { padding-top: 14vh; }
      }
      @media (prefers-reduced-motion: reduce) {
        .pr-skel-dot, .pr-skel-pill, .pr-skel-bar, .pr-skel-chip {
          animation: none; background: rgba(10,10,10,0.1);
        }
        .pr-skel-live { animation: none; opacity: 0.8; }
      }
    </style>
