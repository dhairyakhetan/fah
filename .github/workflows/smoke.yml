# Post-deploy smoke test.
#
# Vercel builds and deploys on push; this runs afterwards and checks the routes
# that fail SILENTLY — the ones a glance at the homepage will never reveal.
#
# Background: a catch-all rewrite regression 404'd /login, /director/*,
# /post/:uuid and /member/:uuid in production while the homepage and all 15
# prerendered pages kept returning 200. It went unnoticed until it was reported
# as "the HoD desk 404s". The build-time half of the defence lives in
# frontend/scripts/verify-routing.mjs; this is the half that checks reality.
#
# The script retries with backoff, so it tolerates the deployment still
# propagating when the job starts.

name: smoke

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      url:
        description: 'Base URL to smoke test (defaults to production)'
        required: false
        default: 'https://www.ngoaquaterra.com'

# A newer push supersedes an in-flight run — no point smoke-testing a
# deployment that has already been replaced.
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Give Vercel a head start before the first probe, so the common case
      # passes on attempt 1 rather than burning a retry.
      - name: Wait for the deployment to start propagating
        run: sleep 45

      - name: Smoke test production
        working-directory: frontend
        env:
          SMOKE_URL: ${{ github.event.inputs.url || 'https://www.ngoaquaterra.com' }}
          SMOKE_ATTEMPTS: '10'
          SMOKE_GAP_MS: '15000'
        run: node scripts/smoke.mjs
