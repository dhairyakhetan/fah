# Pre-merge gate.
#
# The deploy-time gates in `npm run build` are good: accent-token lint, routing
# verification, typecheck, bundle budget, sitemap verification, meta prerender.
# The problem they had was timing. Every one of them ran on Vercel, during the
# deploy, on a machine that was already shipping. Nothing ran before a merge,
# so 701 passing tests and a working ESLint config guarded nothing at all.
#
# This runs the same class of checks on the pull request, plus the two things
# the build never ran: the test suite and ESLint.
#
# WHY THIS DOES NOT SIMPLY RUN `npm run build`
#   Three steps in that script talk to Supabase: compute-org-facts,
#   generate-sitemap and prerender-meta. They need VITE_SUPABASE_URL and
#   VITE_SUPABASE_ANON_KEY and they write generated artifacts. Running them here
#   would mean putting credentials in the repo settings to regenerate files that
#   Vercel regenerates ten minutes later anyway. So this job runs the parts that
#   catch mistakes (typecheck, bundle, budget, lint, tests, routing) and leaves
#   the generators to the deploy, which is the only place their output is used.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks below needs the PR's commits, not just the tip.
          fetch-depth: 0

      # 22, not 20, and not the newest available. Nothing in this repo pins a
      # Node version: there is no `engines` field, no .nvmrc, and no
      # nodeVersion in vercel.json. So the three environments had drifted to
      # three different runtimes, and this job's first run caught it: on Node
      # 20, src/lib/networkStatus.test.ts fails with "navigator is not defined",
      # because the global `navigator` only arrived in Node 21. The same test
      # passes on a developer machine running 24.
      #
      # CI should match what actually builds the site, which is Vercel's default
      # (22.x), not a laptop and not an older LTS. Do not drop this to 20.
      #
      # DONE 2026-09-19: frontend/package.json now declares `engines.node: >=22`,
      # so all three environments agree by declaration rather than coincidence.
      # Expressed as a range, not an exact pin, so it states the real constraint
      # (the `navigator` global, Node 21+) without forcing a Vercel downgrade.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --prefer-offline --no-audit

      # Cheap and standalone: no Supabase, no build output needed. Runs first so
      # an obvious mistake fails in twenty seconds instead of four minutes.
      - name: Routing verification
        run: node scripts/verify-routing.mjs

      # `npm run lint` is eslint + the accent-token linter. ESLint is configured
      # so that only genuine errors fail; the React-Compiler rules are warnings
      # on purpose (see eslint.config.js). Today: 0 errors, 60 warnings.
      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Typecheck
        run: npx tsc -b

      # No Supabase env here, so the bundle is built with those vars undefined.
      # That is fine: this step is checking that the code COMPILES and fits the
      # budget, not that it can reach a database.
      - name: Build
        run: npx vite build

      - name: Bundle budget
        run: node scripts/check-bundle-budget.mjs

  # --------------------------------------------------------------------------
  # Secret and PII scanning.
  #
  # This repository has leaked credentials into git history twice: a service_role
  # key in migrate.js across four commits, and roughly 2,360 member emails and
  # phone numbers in an HR workbook at 72c28f5. Both were found by a human
  # reading the repo months later.
  #
  # IMPORTANT: this scans ONLY the commits a pull request adds, never full
  # history. A full-history scan would fail permanently on those two known
  # incidents and the job would be switched off within a week, which is worse
  # than not having it. The point is to stop the NEXT one.
  # --------------------------------------------------------------------------
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the commits this change adds
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          echo "Scanning $RANGE"
          # An all-zero before-sha means a new branch with no baseline; fall back
          # to the tip commit only rather than scanning everything ever committed.
          case "$RANGE" in
            0000000000000000000000000000000000000000..*) RANGE="${{ github.sha }}~1..${{ github.sha }}" ;;
          esac
          gitleaks detect --source . --log-opts="$RANGE" --redact --verbose

      # gitleaks matches credential SHAPES. It will not notice a spreadsheet of
      # student emails, which is the exact thing that reached this repo's history
      # once already. This is the cheap complement: refuse bulk personal data by
      # file type, wherever it is added.
      - name: Refuse bulk personal data files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.sha }}~1"
          fi
          ADDED=$(git diff --name-only --diff-filter=AM "$BASE" "${{ github.sha }}" || true)
          echo "Files added or modified:"; echo "$ADDED"

          OFFENDERS=$(echo "$ADDED" | grep -iE '\.(csv|xlsx|xls)$' || true)
          if [ -n "$OFFENDERS" ]; then
            echo "::error::Spreadsheet or CSV added. This repo has already had 2,360 member emails and phone numbers committed in an HR workbook. If this file genuinely holds no personal data, add it to the allowlist in this workflow with a comment saying why."
            echo "$OFFENDERS"
            exit 1
          fi

          # Any added text file carrying a lot of email addresses is a data dump
          # whatever its extension. Twenty is far above incidental (a mailto in a
          # page, a couple of contact addresses) and far below a real roster.
          for f in $ADDED; do
            [ -f "$f" ] || continue
            case "$f" in *.lock|*.svg|package-lock.json) continue ;; esac
            COUNT=$(grep -ioE '[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}' "$f" 2>/dev/null | sort -u | wc -l || echo 0)
            if [ "$COUNT" -ge 20 ]; then
              echo "::error::$f contains $COUNT distinct email addresses. Refusing bulk personal data."
              exit 1
            fi
          done
          echo "No bulk personal data detected."

  # ── Advisory only. Never fails the build. ─────────────────────────────────
  # design-probe.js measures a RENDERED page for overflow, paint escape, content
  # fill, contrast, tap targets and heading order - the class of defect that no
  # amount of reading CSS can find. It runs here so a layout regression is
  # visible on the PR rather than discovered by a person scrolling months later.
  #
  # `continue-on-error` AND the script's own exit 0, belt and braces. This repo
  # has already had four of its own DOM detectors produce confident, specific,
  # wrong findings in a single afternoon. A hard gate on rendered measurements
  # is the gate that gets switched off after its first false positive. Printed
  # findings a human reads are worth more than a red X nobody trusts.
  #
  # Separate job, not a step in `verify`, so the ~1 minute of browser download
  # runs in parallel and never slows the gate that can actually block a merge.
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --prefer-offline --no-audit

      # --no-save deliberately: playwright's postinstall downloads browser
      # binaries, so putting it in devDependencies would add that download to
      # every `npm ci` in the `verify` job and on every contributor's machine,
      # to serve one advisory step. Kept out of package.json and the lockfile;
      # run-design-probe.mjs imports it optionally and skips when absent.
      - name: Install Playwright
        run: npm i --no-save playwright && npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Probe
        run: node scripts/run-design-probe.mjs
